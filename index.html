<style>
/* Layout: 위에 탭 알약, 가운데에 큰 시간, 양옆(좁은 화면에선 아래)에 동그란 버튼 두 개.
   색은 첫 스크린샷의 초록 계열을 더 어둡게, 네온으로 올린 다크 단일 테마. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --panel: #0b0709;
  --panel-2: #170d12;
  --line: #2a1620;
  --slate: #5c2142;
  --cream: #fff0f7;
  --mint: #ff4fa3;
  --coral: #ff3b4a;
  --gold: #ff4fa3;
  --muted: #8a6a78;
  --btn-neutral: #1a1217;
  --btn-go: #1d0814;
  --btn-pause: #1d0814;
  --btn-stop: #1c060b;
  --on-cream: #14040c;
  --round: clamp(72px, 8vw, 90px);
  --font-ui: "Inter", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Inter", "Noto Sans KR", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font-ui);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(20px, 4vh, 48px);
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }

/* 탭 알약 */
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
.tab {
  appearance: none; border: 0; background: transparent; color: var(--cream);
  font: 500 17px/1 var(--font-ui); padding: 12px 22px; border-radius: 999px; cursor: pointer; min-height: 44px;
  display: flex; align-items: center; gap: 8px;
}
.tab[aria-selected="true"] { background: var(--panel-2); color: var(--mint); text-shadow: 0 0 12px rgba(255,79,163,.55); box-shadow: inset 0 0 0 1px var(--line); }
.tab .live { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); display: none; }
.tab .live.on { display: block; }

/* 화면 틀: 가운데 내용 + 양옆 동그란 버튼 */
.screen {
  width: 100%; max-width: 1180px;
  display: grid; align-items: center; column-gap: 16px; row-gap: 28px;
  grid-template-columns: 1fr minmax(0, 960px) 1fr;
  grid-template-areas: "l c r" ". x .";
}
.screen > .l { grid-area: l; justify-self: start; }
.screen > .r { grid-area: r; justify-self: end; }
.screen > .c { grid-area: c; min-width: 0; }
.screen > .x { grid-area: x; min-width: 0; }
@media (min-width: 721px) {
  .screen { min-height: calc(100svh - 150px); }
  .screen > .l, .screen > .r { align-self: end; margin-bottom: clamp(24px, 6vh, 64px); }
  .screen.sw-screen { grid-template-areas: "l c r" "l x r"; grid-template-rows: auto 1fr; align-items: start; }
  .screen.sw-screen > .l, .screen.sw-screen > .r { grid-row: 1 / 3; }
}
@media (max-width: 720px) {
  .screen { grid-template-columns: 1fr 1fr; grid-template-areas: "c c" "l r" "x x"; }
}

.round {
  appearance: none; border: 0; width: var(--round); height: var(--round); border-radius: 50%;
  font: 500 clamp(15px, 1.6vw, 18px)/1 var(--font-ui); cursor: pointer; flex: none;
  background: var(--btn-neutral); color: var(--cream); transition: transform .08s, opacity .15s;
}
.round:active { transform: scale(.96); }
.round:disabled { opacity: .4; cursor: default; transform: none; }
.round { box-shadow: inset 0 0 0 1.5px rgba(138,106,120,.25); }
.round.go { background: var(--btn-go); color: var(--mint); box-shadow: inset 0 0 0 1.5px rgba(255,79,163,.4), 0 0 26px rgba(255,79,163,.16); }
.round.pause { background: var(--btn-pause); color: var(--gold); box-shadow: inset 0 0 0 1.5px rgba(255,79,163,.4), 0 0 26px rgba(255,79,163,.14); }
.round.stop { background: var(--btn-stop); color: var(--coral); box-shadow: inset 0 0 0 1.5px rgba(255,59,74,.45), 0 0 26px rgba(255,59,74,.16); }

/* 타이머 설정: 휠 */
.wheels { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); height: 240px; max-width: 520px; margin-inline: auto; }
.hl { position: absolute; left: 0; right: 0; top: 96px; height: 48px; border-radius: 12px; background: var(--panel-2); pointer-events: none; }
.wheel {
  position: relative; z-index: 1; height: 240px; overflow-y: auto; padding-block: 96px;
  scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
  mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
}
.wheel::-webkit-scrollbar { display: none; }
.wheel .it {
  height: 48px; scroll-snap-align: center; display: flex; align-items: center; justify-content: flex-end; padding-right: 47%;
  font: 200 32px/1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; user-select: none;
}
.wheel .it.sel { color: var(--cream); text-shadow: 0 0 14px rgba(255,79,163,.4); }
.unit { position: absolute; z-index: 2; top: 96px; height: 48px; display: flex; align-items: center; font-size: 20px; pointer-events: none; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 520px; margin: 36px auto 0; }
.preset {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--cream); border-radius: 999px;
  min-height: 56px; font: 300 24px/1 var(--font-num); cursor: pointer; transition: background .15s, border-color .15s, transform .08s;
}
.preset small { font: 500 15px var(--font-ui); color: var(--muted); margin-left: 2px; }
.preset:hover { background: var(--panel-2); border-color: var(--slate); }
.preset:active { transform: scale(.97); }
.preset.active { border-color: var(--mint); color: var(--mint); box-shadow: 0 0 16px rgba(255,79,163,.25); }
.preset.active small { color: var(--mint); }

/* 타이머 진행 */
.stage { position: relative; width: min(100%, 960px, calc(100svh - 170px)); min-width: 240px; aspect-ratio: 1; margin-inline: auto; container-type: inline-size; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ring-track { stroke: var(--line); }
.ring-fg { stroke: var(--mint); stroke-linecap: butt; transition: stroke .4s; filter: drop-shadow(0 0 9px rgba(255,79,163,.45)) drop-shadow(0 0 24px rgba(255,79,163,.28)); }
.ring-core { display: none; }
.stage::before { content: ""; position: absolute; inset: -16%; pointer-events: none; border-radius: 50%; background: radial-gradient(closest-side, transparent 60%, rgba(255,79,163,.20) 72%, rgba(255,79,163,.10) 80%, rgba(255,79,163,.035) 91%, transparent 100%); transition: opacity .4s; }
.stage.warn::before { background: radial-gradient(closest-side, transparent 60%, rgba(255,45,61,.20) 72%, rgba(255,45,61,.10) 80%, rgba(255,45,61,.035) 91%, transparent 100%); }
.stage.done .ring-track { stroke: #ff4d5e; filter: drop-shadow(0 0 8px rgba(255,77,94,.4)); }
.stage.done::before { background: radial-gradient(closest-side, transparent 60%, rgba(255,77,94,.20) 72%, rgba(255,77,94,.10) 80%, rgba(255,77,94,.035) 91%, transparent 100%); }
.stage::before { opacity: 0; }
.stage.done::before { opacity: 1; }
.stage.done .ring-core { opacity: 0; }
.ring-fg.warn { stroke: #ff2d3d; filter: drop-shadow(0 0 9px rgba(255,45,61,.45)) drop-shadow(0 0 24px rgba(255,45,61,.28)); }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqw; }
.time { font-family: var(--font-num); font-weight: 300; font-size: 34cqw; line-height: 1; letter-spacing: -.03em; transform: scale(.92, 1.5); text-shadow: 0 0 5px rgba(255,79,163,.8), 0 0 16px rgba(255,79,163,.55), 0 0 40px rgba(255,79,163,.38); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--cream); }
.time.long { font-size: 25cqw; }
.stage.paused .time { opacity: .55; }
.endat { position: absolute; left: 0; right: 0; top: calc(50% - 30cqw); justify-content: center; display: flex; align-items: center; gap: 1.6cqw; font-size: 5.6cqw; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage:has(.time.long) .endat { top: calc(50% - 22cqw); }
.stage .endat svg { position: static; inset: auto; width: 5.4cqw; height: 5.4cqw; fill: currentColor; }
.stage.warn .time { text-shadow: 0 0 5px rgba(255,45,61,.8), 0 0 16px rgba(255,45,61,.55), 0 0 40px rgba(255,45,61,.38); }
.stage.done .ring-fg { opacity: 0; }

@keyframes pulse { 50% { opacity: .3; } }

/* 스톱워치 */
.sw { container-type: inline-size; }
.sw-time { font-family: var(--font-num); font-weight: 300; font-size: 22cqw; line-height: 1; letter-spacing: -.03em; transform: scale(.92, 1.4); text-shadow: 0 0 5px rgba(255,79,163,.8), 0 0 16px rgba(255,79,163,.55), 0 0 40px rgba(255,79,163,.38); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: center; color: var(--cream); padding-block: 9cqw; }
.sw-time.long { font-size: 17.5cqw; }
.lap-head, .lap { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 14px 4px; font-variant-numeric: tabular-nums; }
.lap-head { color: var(--muted); font-size: 16px; border-bottom: 1px solid var(--line); }
.lap-head span:nth-child(2), .lap span:nth-child(2) { text-align: center; }
.lap-head span:nth-child(3), .lap span:nth-child(3) { text-align: right; }
.lap { border-bottom: 1px solid var(--line); font: 300 18px/1.2 var(--font-num); font-variant-numeric: tabular-nums; }
.lap span:first-child { font-family: var(--font-ui); color: var(--cream); }
.lap.best { color: var(--mint); }
.lap.best span:first-child { color: var(--mint); }
.lap.worst { color: var(--coral); }
.lap.worst span:first-child { color: var(--coral); }
.laps-wrap { max-width: 780px; margin-inline: auto; }
.laps { max-height: 36vh; overflow-y: auto; }

@media (prefers-reduced-motion: reduce) {
  .stage.done .ring-track { animation: none; }
  .ring-fg, .round, .preset { transition: none; }
}
@media (max-width: 400px) { .tab { padding-inline: 16px; } .wheel .it { font-size: 27px; } }
</style>

<div class="tabs" role="tablist" aria-label="모드">

</div>

<!-- 타이머 -->
<section id="panel-timer" role="tabpanel" aria-labelledby="tab-timer" style="width:100%;display:flex;justify-content:center;">
  <!-- 설정 화면 -->
  <div class="screen" id="t-setup">

          <circle class="ring-track" cx="160" cy="160" r="159" fill="none" stroke-width="2"></circle>
          <circle class="ring-fg" id="ring-fg" cx="160" cy="160" r="159" fill="none" stroke-width="2" transform="rotate(-90 160 160)"></circle>
          <circle class="ring-core" id="ring-core" cx="160" cy="160" r="150" fill="none" stroke-width="5" transform="rotate(-90 160 160)"></circle>
        </svg>

          <div class="endat" id="t-endat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.4-1.8H9.6A2.5 2.5 0 0 0 12 22zm7-5.5v-5.2c0-3.2-1.7-5.9-4.7-6.6V4a2.3 2.3 0 0 0-4.6 0v.7C6.7 5.4 5 8.1 5 11.3v5.2l-2 2v1h18v-1z"/></svg><span id="t-endtxt"></span></div>

        </div>
      </div>
    </div>
    <button class="round pause r" id="t-toggle" type="button">일시 정지</button>
  </div>
</section>

<!-- 스톱워치 -->
<section id="panel-sw" role="tabpanel" aria-labelledby="tab-sw" hidden style="width:100%;justify-content:center;">
  <div class="screen sw-screen">
    <button class="round l" id="s-side" type="button" disabled>랩</button>
    <div class="c sw"><div class="sw-time" id="s-time">00:00.00</div></div>
    <button class="round go r" id="s-toggle" type="button">시작</button>
    <div class="x">
      <div class="laps-wrap">
        <div class="lap-head"><span>랩 번호</span><span>스플릿</span><span>전체</span></div>
        <div class="laps" id="laps"></div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var pad = function (n) { return String(n).padStart(2, "0"); };

    $("#t-endtxt").textContent = fmtClockTime(T.endAt);
    $("#t-endat").style.visibility = T.state === "running" ? "visible" : "hidden";
    tToggle.textContent = T.state === "running" ? "일시 정지" : T.state === "paused" ? "계속" : "다시 시작";
    tToggle.className = "round r " + (T.state === "running" ? "pause" : "go");
  }
  function startTimer(ms) {
    audio();
    T.total = ms; T.remaining = ms; T.endAt = Date.now() + ms; T.state = "running";
    updateWake(); renderTimer(); loop();
  }
  function resumeTimer() {
    audio();
    if (T.state === "done") T.remaining = T.total;
    T.endAt = Date.now() + T.remaining; T.state = "running";
    updateWake(); renderTimer(); loop();
  }
  function pauseTimer() { T.remaining = tRem(); T.state = "paused"; updateWake(); renderTimer(); }
  function cancelTimer() {
    T.total = 0; T.remaining = 0; T.state = "setup"; updateWake(); renderTimer(); syncWheels();
  }
  function finishTimer() { T.state = "done"; T.remaining = 0; updateWake(); beep(); }

  $("#t-start").addEventListener("click", function () { var ms = wheelMs(); if (ms > 0) startTimer(ms); });
  $("#t-cancel").addEventListener("click", cancelTimer);
  tToggle.addEventListener("click", function () { if (T.state === "running") pauseTimer(); else resumeTimer(); });
  document.querySelectorAll(".preset").forEach(function (b) {
    b.addEventListener("click", function () { startTimer(Number(b.dataset.min) * 60000); });
  });

  /* ---------- 스톱워치 ---------- */
  var S = { state: "idle", base: 0, startAt: 0, laps: [], last: 0 };
  var sTime = $("#s-time"), sToggle = $("#s-toggle"), sSide = $("#s-side"), lapsEl = $("#laps");

  function sEl() { return S.state === "running" ? S.base + (Date.now() - S.startAt) : S.base; }
  function fmtSW(ms) {
    var cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return { t: (h > 0 ? h + ":" + pad(m) : pad(m)) + ":" + pad(sec) + "." + pad(cs), long: h > 0 };
  }
  function renderSW() {
    var f = fmtSW(sEl());
    sTime.textContent = f.t; sTime.classList.toggle("long", f.long);
    sToggle.textContent = S.state === "running" ? "정지" : "시작";
    sToggle.className = "round r " + (S.state === "running" ? "stop" : "go");
    sSide.textContent = S.state === "paused" ? "재설정" : "랩";
    sSide.disabled = S.state === "idle";
    $("#live-sw").classList.toggle("on", S.state === "running");
  }
  function renderLaps() {
    var html = "";
    var splits = S.laps.map(function (l) { return l.split; });
    var best = Math.min.apply(null, splits), worst = Math.max.apply(null, splits);
    for (var i = S.laps.length - 1; i >= 0; i--) {
      var l = S.laps[i], cls = "lap";
      if (S.laps.length > 2) { if (l.split === best) cls += " best"; else if (l.split === worst) cls += " worst"; }
      html += '<div class="' + cls + '"><span>랩 ' + (i + 1) + "</span><span>" + fmtSW(l.split).t + "</span><span>" + fmtSW(l.total).t + "</span></div>";
    }
    lapsEl.innerHTML = html;
  }
  sToggle.addEventListener("click", function () {
    audio();
    if (S.state === "running") { S.base = sEl(); S.state = "paused"; }
    else { S.startAt = Date.now(); S.state = "running"; loop(); }
    updateWake(); renderSW();
  });
  sSide.addEventListener("click", function () {
    if (S.state === "running") {
      var t = sEl(); S.laps.push({ split: t - S.last, total: t }); S.last = t; renderLaps();
    } else if (S.state === "paused") {
      S.state = "idle"; S.base = 0; S.last = 0; S.laps = []; renderLaps(); renderSW();
    }
  });

  /* ---------- 갱신 ---------- */
  var raf = 0;
  function loop() {
    if (raf) return;
    var step = function () {
      raf = 0;
      if (T.state === "running") renderTimer();
      if (S.state === "running") renderSW();
      if (T.state === "running" || S.state === "running") raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  setInterval(function () { if (T.state === "running") renderTimer(); }, 250);

  showTab("timer");
  renderTimer(); renderSW(); renderLaps();
  syncWheels();
  /* 폰트·레이아웃이 잡힌 뒤 한 번 더 맞춤 */
  requestAnimationFrame(function () { if (T.state === "setup") syncWheels(); });
})();
</script>

</body></html>
